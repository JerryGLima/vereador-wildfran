<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Desenho AR Pro com Gemini - System</title>
    
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: sans-serif; 
            background-color: #000; 
        }
        
        #ui-container { 
            position: absolute; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 999; 
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 95%;
            max-width: 400px;
            pointer-events: none;
        }

        .ui-panel {
            background: rgba(0, 0, 0, 0.8); 
            color: white; 
            padding: 15px; 
            border-radius: 12px; 
            text-align: center;
            margin-bottom: 10px;
            pointer-events: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 100%;
            box-sizing: border-box;
        }

        #image-setup-panel { display: block; }
        #ar-controls-panel { display: none; }
        
        /* Estilos dos Controles */
        .control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 14px;
        }
        
        input[type="range"] {
            width: 60%;
        }

        /* Botões */
        input[type="file"] { display: none; }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            cursor: pointer;
            background-color: #007AFF;
            color: white;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 5px;
            border: none;
            width: 100%;
            box-sizing: border-box;
            transition: background 0.2s;
        }

        .btn:active { background-color: #0056b3; }
        .btn-success { background-color: #34C759; }
        .btn-warning { background-color: #FF9500; }
        .btn-gemini { background-color: #AF52DE; margin-top: 10px; }

        #gemini-response {
            margin-top: 10px;
            font-size: 13px;
            font-style: italic;
            color: #E5E5EA;
            text-align: left;
            border-top: 1px solid #444;
            padding-top: 10px;
            display: none;
        }

        .a-enter-vr-button { bottom: 10px !important; right: 10px !important; }
    </style>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <script>
        // A chave da API é injetada dinamicamente pelo ambiente
        const apiKey = ""; 

        AFRAME.registerComponent('ar-projector-system', {
            init: function () {
                this.xrHitTestSource = null;
                this.viewerSpace = null;
                this.refSpace = null;
                this.isImageLoaded = false;
                this.isPinned = false; // Define se a imagem está presa no chão
                
                const sceneEl = this.el.sceneEl;
                const imageSetupPanel = document.getElementById('image-setup-panel');
                const arControlsPanel = document.getElementById('ar-controls-panel');
                const fileInput = document.getElementById('file-input');
                const uploadButton = document.getElementById('upload-button');
                const imagePlane = document.getElementById('image-plane');
                const drawingReticle = document.getElementById('drawing-reticle');
                const pinButton = document.getElementById('pin-button');
                const geminiButton = document.getElementById('ask-gemini');
                
                let base64ImageString = "";
                let imageMimeType = "";

                // 1. CARREGAR IMAGEM
                uploadButton.addEventListener('click', () => {
                    const file = fileInput.files[0];
                    if (file) {
                        imageMimeType = file.type;
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            // CORREÇÃO AQUI: Usamos a Data URL diretamente
                            const imageDataUrl = e.target.result;

                            // Cria uma imagem temporária apenas para ler a proporção (largura/altura)
                            const tempImg = new Image();
                            tempImg.onload = () => {
                                // Aplica a textura usando a Data URL string
                                imagePlane.setAttribute('material', {
                                    src: imageDataUrl, 
                                    transparent: true,
                                    opacity: 0.9
                                });

                                // Ajusta a proporção do plano
                                const aspectRatio = tempImg.width / tempImg.height;
                                imagePlane.setAttribute('height', '0.4'); // 40cm base
                                imagePlane.setAttribute('width', (0.4 * aspectRatio).toString());
                                
                                this.isImageLoaded = true;
                                base64ImageString = imageDataUrl.split(',')[1]; // Pega só o base64 para a IA
                                
                                imageSetupPanel.style.display = 'none';
                                arControlsPanel.style.display = 'block';

                                const arButton = document.querySelector('.a-enter-vr-button');
                                if (arButton) arButton.style.display = 'block';
                            };
                            // Inicia o carregamento da imagem temporária
                            tempImg.src = imageDataUrl;
                        };
                        reader.readAsDataURL(file);
                    } else {
                        alert("Por favor, selecione uma imagem primeiro.");
                    }
                });

                // 2. CONTROLES DA IMAGEM (Tamanho, Rotação, Transparência)
                document.getElementById('scale-slider').addEventListener('input', (e) => {
                    const val = e.target.value;
                    imagePlane.setAttribute('scale', `${val} ${val} ${val}`);
                });

                document.getElementById('rotation-slider').addEventListener('input', (e) => {
                    const val = e.target.value;
                    // Roda a imagem no eixo Z (pois ela já está deitada no chão no eixo X)
                    imagePlane.setAttribute('rotation', `-90 0 ${val}`);
                });

                document.getElementById('opacity-slider').addEventListener('input', (e) => {
                    const val = e.target.value;
                    imagePlane.setAttribute('material', 'opacity', val);
                });

                // 3. FIXAR IMAGEM NO CHÃO
                pinButton.addEventListener('click', () => {
                    this.isPinned = !this.isPinned;
                    if (this.isPinned) {
                        pinButton.textContent = "Desbloquear Imagem";
                        pinButton.classList.replace('btn-warning', 'btn-success');
                    } else {
                        pinButton.textContent = "Fixar Imagem no Chão";
                        pinButton.classList.replace('btn-success', 'btn-warning');
                    }
                });

                // 4. INTEGRAÇÃO COM GEMINI API
                geminiButton.addEventListener('click', async () => {
                    const responseDiv = document.getElementById('gemini-response');
                    if (!base64ImageString) return;

                    geminiButton.textContent = "Analisando...";
                    geminiButton.disabled = true;
                    responseDiv.style.display = 'block';
                    responseDiv.innerHTML = "A IA está olhando sua imagem...";

                    try {
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                        const payload = {
                            contents: [{
                                role: "user",
                                parts: [
                                    { text: "Atue como um professor de desenho. Analise esta imagem e me dê uma dica super curta e prática (máximo 3 linhas) de como eu posso começar a desenhá-la no papel usando formas geométricas." },
                                    { inlineData: { mimeType: imageMimeType, data: base64ImageString } }
                                ]
                            }]
                        };

                        const res = await fetch(url, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(payload)
                        });

                        const data = await res.json();
                        const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "Não consegui analisar a imagem.";
                        responseDiv.innerHTML = `<strong>Dica do Gemini:</strong><br>${text}`;
                    } catch (error) {
                        responseDiv.innerHTML = "Erro ao conectar com a IA.";
                    } finally {
                        geminiButton.textContent = "Pedir Nova Dica à IA";
                        geminiButton.disabled = false;
                    }
                });

                // 5. CONFIGURAÇÃO AR (Sessão WebXR)
                sceneEl.addEventListener('loaded', () => {
                    const arButton = document.querySelector('.a-enter-vr-button');
                    if (arButton) arButton.style.display = 'none'; // Esconde até carregar imagem
                });

                sceneEl.addEventListener('enter-vr', () => {
                    if (sceneEl.is('ar-mode')) {
                        const session = sceneEl.renderer.xr.getSession();
                        if (session) {
                            session.requestReferenceSpace('viewer').then((space) => {
                                this.viewerSpace = space;
                               session.requestHitTestSource({ space: this.viewerSpace })
                                    .then((hitTestSource) => { this.xrHitTestSource = hitTestSource; });
                            });
                            session.requestReferenceSpace('local').then((space) => { this.refSpace = space; });
                        }
                    }
                });

                // 6. DESENHAR (Ao tocar na tela)
                sceneEl.addEventListener('touchstart', (e) => {
                    // Impede de desenhar se clicou em um botão da interface
                    if (e.target.closest('#ui-container')) return;

                    // Só desenha se a imagem estiver fixada e o modo AR ativo
                    if (!sceneEl.is('ar-mode') || !this.isPinned || !drawingReticle.getAttribute('visible')) return;

                    const pos = drawingReticle.getAttribute('position');
                    const paint = document.createElement('a-sphere');
                    paint.setAttribute('color', '#FF2D55'); // Tinta Rosa/Vermelha
                    paint.setAttribute('radius', '0.005'); // Tinta fina (5mm)
                    paint.setAttribute('position', { x: pos.x, y: pos.y, z: pos.z });
                    sceneEl.appendChild(paint);
                });
            },
            
            // Loop de atualização da câmera AR
            tick: function () {
                const sceneEl = this.el.sceneEl;
                if (sceneEl.is('ar-mode') && this.isImageLoaded) {
                    const frame = sceneEl.frame;
                    const xrHitTestSource = this.xrHitTestSource;
                    const imagePlane = document.getElementById('image-plane');
                    const drawingReticle = document.getElementById('drawing-reticle');

                    if (frame && xrHitTestSource && this.refSpace) {
                        const hitTestResults = frame.getHitTestResults(xrHitTestSource);
                        if (hitTestResults.length > 0) {
                            const pose = hitTestResults[0].getPose(this.refSpace);
                            const pos = pose.transform.position;

                            // O retículo de desenho (mira central) acompanha SEMPRE a câmera
                            drawingReticle.setAttribute('position', { x: pos.x, y: pos.y, z: pos.z });
                            drawingReticle.setAttribute('visible', 'true');

                            // A imagem só acompanha a câmera se NÃO estiver fixada
                            if (!this.isPinned) {
                                imagePlane.setAttribute('position', { x: pos.x, y: pos.y, z: pos.z });
                                imagePlane.setAttribute('visible', 'true');
                            }
                        } else {
                            drawingReticle.setAttribute('visible', 'false');
                            if (!this.isPinned) imagePlane.setAttribute('visible', 'false');
                        }
                    }
                }
            }
        });
    </script>
</head>
<body>

    <div id="ui-container">
        <!-- Painel Inicial -->
        <div id="image-setup-panel" class="ui-panel">
            <h3>Preparar Desenho</h3>
            <label for="file-input" class="btn">1. Escolher Imagem</label>
            <input id="file-input" type="file" accept="image/*">
            <button id="upload-button" class="btn btn-success" style="margin-top: 15px;">2. Iniciar AR</button>
        </div>

        <!-- Painel de Controles (Aparece após carregar a imagem) -->
        <div id="ar-controls-panel" class="ui-panel">
            <div class="control-group">
                <label>Tamanho:</label>
                <input type="range" id="scale-slider" min="0.2" max="3" step="0.1" value="1">
            </div>
            <div class="control-group">
                <label>Girar:</label>
                <input type="range" id="rotation-slider" min="0" max="360" step="1" value="0">
            </div>
            <div class="control-group">
                <label>Transparência:</label>
                <input type="range" id="opacity-slider" min="0.1" max="1" step="0.1" value="0.9">
            </div>
            
            <button id="pin-button" class="btn btn-warning">Fixar Imagem no Chão</button>
            <button id="ask-gemini" class="btn btn-gemini">🌟 Dica da IA (Gemini)</button>
            
            <div id="gemini-response"></div>
        </div>
    </div>

    <!-- Cena A-Frame com WebXR -->
    <a-scene 
        webxr="requiredFeatures: hit-test;" 
        ar-projector-system 
        renderer="antialias: true; alpha: true; colorManagement: true;">
        
        <a-camera position="0 1.6 0"></a-camera>

        <!-- PLANO DA IMAGEM -->
        <a-plane id="image-plane" 
                 visible="false"
                 rotation="-90 0 0"
                 material="shader: flat; transparent: true; opacity: 0.9; side: double">
        </a-plane>

        <!-- MIRA DE DESENHO (O ponto onde a tinta vai cair) -->
        <a-entity id="drawing-reticle" 
                  visible="false"
                  geometry="primitive: ring; radiusInner: 0.005; radiusOuter: 0.01"
                  material="color: #FF2D55; shader: flat"
                  rotation="-90 0 0">
        </a-entity>

        <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
    </a-scene>

</body>
</html>
